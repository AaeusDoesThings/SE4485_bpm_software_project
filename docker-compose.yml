version: "3.9"

services:
  backend:
    build: ./server
    container_name: fastapi_server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    restart: always

  frontend:
    build: ./client
    container_name: nextjs_client
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

